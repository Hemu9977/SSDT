name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-deploy.yml'
  workflow_dispatch:

# One concurrent deployment at a time; cancel in-flight runs on the same branch
# so a rapid second push doesn't race with the first.
concurrency:
  group: frontend-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  AWS_REGION: ap-south-1

jobs:
  # ──────────────────────────────────────────────────────────────────────────────
  # 1. Build
  # ──────────────────────────────────────────────────────────────────────────────
  build:
    name: Build React App
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Build
        env:
          # These are safe, public-facing values baked into the JS bundle.
          # The API URL points to your ALB or custom domain.
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}
          REACT_APP_GOOGLE_CLIENT_ID: ${{ secrets.REACT_APP_GOOGLE_CLIENT_ID }}
          # Silence CRA's default "CI=true treats warnings as errors" behaviour
          # only if you have pre-existing warnings you haven't cleaned yet.
          # Remove this line once all warnings are resolved.
          CI: false
        run: npm run build

      # Upload build artifact so the deploy job can download it without rebuilding
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-${{ github.sha }}
          path: frontend/build/
          retention-days: 3

  # ──────────────────────────────────────────────────────────────────────────────
  # 2. Deploy to S3 + invalidate CloudFront
  # ──────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to S3 & Invalidate CloudFront
    runs-on: ubuntu-latest
    needs: build
    environment: production  # requires manual approval if configured in GitHub settings

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build-${{ github.sha }}
          path: build/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ── Sync static assets (JS/CSS/images) with long-lived cache headers ───────
      # These files have content-hashed filenames (e.g. main.abc123.js), so they
      # are safe to cache for 1 year. On next deploy the hashes change, so users
      # automatically receive fresh files without needing a cache bust.
      - name: Sync hashed static assets (long cache)
        run: |
          aws s3 sync build/static/ s3://${{ secrets.S3_BUCKET_NAME }}/static/ \
            --cache-control "public, max-age=31536000, immutable" \
            --delete \
            --exact-timestamps

      # ── Sync remaining files (HTML, manifest, robots) with no-cache headers ───
      # index.html must NEVER be cached by CloudFront or browsers — it is the
      # entry point for the SPA and must always be fresh so new JS chunk hashes
      # are picked up immediately after a deploy.
      - name: Sync root files (no cache)
        run: |
          aws s3 sync build/ s3://${{ secrets.S3_BUCKET_NAME }}/ \
            --exclude "static/*" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --delete \
            --exact-timestamps

      # ── Invalidate only the files that must be fresh immediately ─────────────
      # Invalidating /* is simpler but costs more (each path = 1 invalidation).
      # Targeting only non-hashed files keeps costs minimal while still ensuring
      # index.html and the service worker are never stale.
      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

      - name: Deployment summary
        run: |
          echo "### Deployment complete" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **S3 bucket**: \`${{ secrets.S3_BUCKET_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **CloudFront**: \`${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Region**: \`${{ env.AWS_REGION }}\`" >> $GITHUB_STEP_SUMMARY
