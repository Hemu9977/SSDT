# /etc/systemd/system/valkey.service.d/override.conf
[Unit]
# Wants (not Requires): if Secrets Manager is briefly unreachable, Valkey still starts
# from the TLS/ACL files already on disk instead of staying down.
Wants=network-online.target fortexa-valkey-secrets.service
After=network-online.target fortexa-valkey-secrets.service disable-thp.service
# Never give up restarting.
StartLimitIntervalSec=0

[Service]
Restart=always
RestartSec=2
LimitNOFILE=65535
# Room for the shutdown save on SIGTERM (EC2 stop / reboot / patching).
TimeoutStopSec=90
NoNewPrivileges=yes
PrivateTmp=yes
ProtectSystem=strict
ProtectHome=yes
ReadWritePaths=/var/lib/valkey /var/log/valkey /run/valkey
