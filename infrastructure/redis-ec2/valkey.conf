# Fortexa production Valkey (self-managed on EC2). Rendered by user-data.sh:
# __BIND_IP__ and __MAXMEMORY__ are substituted at boot. See README.md for why
# each non-default setting exists; the short version:
#   - TLS only, private network only, ACL auth  -> never reachable unauthenticated
#   - noeviction                               -> BullMQ requirement; volatile-* would evict locks
#   - AOF everysec + RDB                       -> queue/lock state survives restarts and reboots

# ── Network ──────────────────────────────────────────────────────────────────
bind __BIND_IP__ 127.0.0.1
protected-mode yes
port 0
tls-port 6379
tcp-backlog 511
tcp-keepalive 60
timeout 0
maxclients 1000

# ── TLS ──────────────────────────────────────────────────────────────────────
tls-cert-file /etc/valkey/tls/server.crt
tls-key-file /etc/valkey/tls/server.key
tls-ca-cert-file /etc/valkey/tls/ca.crt
tls-auth-clients no
tls-protocols "TLSv1.2 TLSv1.3"
tls-prefer-server-ciphers yes

# ── Auth ─────────────────────────────────────────────────────────────────────
aclfile /etc/valkey/users.acl

# ── Memory ───────────────────────────────────────────────────────────────────
maxmemory __MAXMEMORY__
maxmemory-policy noeviction

# ── Persistence ──────────────────────────────────────────────────────────────
dir /var/lib/valkey
dbfilename dump.rdb
save 900 1 300 10 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
appendonly yes
appendfilename "appendonly.aof"
appenddirname "appendonlydir"
appendfsync everysec
aof-use-rdb-preamble yes
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes

# ── Process ──────────────────────────────────────────────────────────────────
daemonize no
supervised systemd
loglevel notice
logfile /var/log/valkey/valkey.log
databases 16
latency-monitor-threshold 100
slowlog-log-slower-than 10000
slowlog-max-len 128
